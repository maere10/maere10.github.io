
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Подтверждение возраста 18+</title>
  <meta name="description" content="Информационная страница подтверждения возраста.">

  <!-- Превью для социальных сетей -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://maere10.github.io/">
  <meta property="og:title" content="Подтверждение возраста 18+">
  <meta property="og:description" content="Для продолжения необходимо подтвердить возраст.">
  <meta property="og:image" content="https://i.postimg.cc/6t8QnGnS/f96897ac-5436-4825-8c98-4c681e1b5147.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Подтверждение возраста">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Подтверждение возраста 18+">
  <meta name="twitter:description" content="Для продолжения необходимо подтвердить возраст.">
  <meta name="twitter:image" content="https://i.postimg.cc/6t8QnGnS/f96897ac-5436-4825-8c98-4c681e1b5147.png">

  <meta name="theme-color" content="#ffffff">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #252525;
      display: flex;
      flex-direction: column;
    }

    .flag {
      height: 8px;
      background: linear-gradient(
        to bottom,
        #ffffff 33.33%,
        #0039a6 33.33% 66.66%,
        #d52b1e 66.66%
      );
    }

    header {
      padding: 22px 16px;
      text-align: center;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
    }

    .age-mark {
      font-size: 27px;
      font-weight: 800;
      color: #0039a6;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 16px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 32px 25px;
      background: #fff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 35px rgba(0,0,0,.07);
    }

    /* Увеличенная кликабельная картинка */
    .image-link {
      display: block;
      width: 100%;
      max-width: 360px;
      margin: 0 auto 25px;
      cursor: pointer;
    }

    .preview-image {
      display: block;
      width: 100%;
      height: auto;
      max-width: 360px;
      border-radius: 8px;
      transition: transform .2s ease;
    }

    .image-link:hover .preview-image {
      transform: scale(1.03);
    }

    h1 {
      font-size: 26px;
      line-height: 1.25;
      margin-bottom: 13px;
    }

    .description {
      font-size: 15px;
      line-height: 1.6;
      color: #777;
      margin-bottom: 27px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .yes {
      color: white;
      background: #0039a6;
    }

    .yes:hover {
      background: #002d82;
    }

    .no {
      color: #444;
      background: #eee;
    }

    .notice {
      display: none;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    footer {
      padding: 22px 15px;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
      color: #888;
      background: #fff;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px 18px;
      }

      .image-link {
        max-width: 100%;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="flag"></div>

  <header>
    <div class="age-mark">18+</div>
  </header>

  <main>
    <section class="card">

      <a
        href="https://i.postimg.cc/6t8QnGnS/f96897ac-5436-4825-8c98-4c681e1b5147.png"
        target="_blank"
        rel="noopener noreferrer"
        class="image-link"
        aria-label="Открыть изображение в полном размере"
      >
        <img
          class="preview-image"
          src="https://i.postimg.cc/6t8QnGnS/f96897ac-5436-4825-8c98-4c681e1b5147.png"
          alt="Иллюстрация"
        >
      </a>

      <h1>Вам исполнилось 18 лет?</h1>

      <p class="description">
        Для продолжения необходимо подтвердить,
        что вам уже исполнилось 18 лет.
      </p>

      <div class="buttons">
        <button class="yes" onclick="confirmAge()">
          ДА, МНЕ ЕСТЬ 18 ЛЕТ
        </button>

        <button class="no" onclick="declineAge()">
          НЕТ, МНЕ НЕТ 18 ЛЕТ
        </button>
      </div>

      <div class="notice" id="notice"></div>

    </section>
  </main>

  <footer>
    Информационная страница подтверждения возраста.
    <br>
    © 2026
  </footer>

  <div class="flag"></div>

  <script>
    function confirmAge() {
      const notice = document.getElementById("notice");
      notice.style.display = "block";
      notice.textContent =
        "Возраст подтверждён. Для продолжения используйте ссылку на основной сайт.";
    }

    function declineAge() {
      const notice = document.getElementById("notice");
      notice.style.display = "block";
      notice.textContent =
        "Доступ к материалам для совершеннолетних закрыт.";
    }
  </script>

</body>
</html>
